name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish win-x64 (self-contained)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "NockAI-win-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish src/NockAI/NockAI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $out `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false
          Copy-Item src/NockAI/Secrets.local.json.example $out -Force
          $zip = Join-Path $env:RUNNER_TEMP "NockAI-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: NockAI ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: ${{ env.ZIP }}
          fail_on_unmatched_files: true
